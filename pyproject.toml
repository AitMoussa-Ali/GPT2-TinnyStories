[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GPT2-Tiny"
version = "0.1.0"
description = "An educational GPT-2-style language model trained from scratch on TinyStories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
"torch>=2.5.0",
"datasets>=3.0.0",
"tokenizers>=0.21.0",
"numpy>=2.0.0",
"tqdm>=4.66.0",
"matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
"pytest>=8.0.0",
"ruff>=0.9.0",
"ipykernel>=6.29.0",
"transformers>=4.45.0",
]

[tool.setuptools.packages.find]
include = ["model*", "training*", "tokenizer*", "*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]